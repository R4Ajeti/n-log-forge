name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,sentry]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify base wheel without Sentry
        shell: bash
        run: |
          python -m venv .ci-base-venv
          .ci-base-venv/bin/python -m pip install --no-deps dist/*.whl
          .ci-base-venv/bin/python -c "from n_log_forge import logger; logger.info('base install works')"
          .ci-base-venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('sentry_sdk') is None"
